name: Apply OAuth XP bearer migration

on:
  push:
    branches:
      - fix/oauth-xp-bearer-20260812
    paths:
      - ".github/workflows/apply-oauth-xp-bearer.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/oauth-xp-bearer-20260812
          fetch-depth: 0
      - name: Replace deprecated XP key with SPMT session bearer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server.ts')
          text = path.read_text()

          old = "const SPMT_API_KEY = String(process.env.SPMT_API_KEY || '').trim();\n"
          if old not in text:
              raise SystemExit('SPMT_API_KEY declaration not found')
          text = text.replace(old, '', 1)

          old = "async function awardSpmtXp(input: {\n  userId: string;\n"
          new = "async function awardSpmtXp(input: {\n  userId: string;\n  accessToken: string;\n"
          if old not in text:
              raise SystemExit('awardSpmtXp signature not found')
          text = text.replace(old, new, 1)

          old = "  if (!SPMT_API_KEY) return { skipped: true, reason: 'SPMT_API_KEY not configured' };"
          new = "  if (!input.accessToken) return { skipped: true, reason: 'SPMT OAuth session not available' };"
          if old not in text:
              raise SystemExit('deprecated XP key guard not found')
          text = text.replace(old, new, 1)

          old = "        Authorization: `Bearer ${SPMT_API_KEY}`,"
          new = "        Authorization: `Bearer ${input.accessToken}`,"
          if old not in text:
              raise SystemExit('deprecated XP authorization header not found')
          text = text.replace(old, new, 1)

          old = "      body: JSON.stringify({\n        sourceApp: 'spacemountain',\n        ...award,\n      }),"
          new = "      body: JSON.stringify({\n        ...award,\n        sourceApp: 'spacemountain-live',\n      }),"
          if old not in text:
              raise SystemExit('XP sourceApp body not found')
          text = text.replace(old, new, 1)

          old = "          userId: spmtUser.id,\n          eventType:"
          new = "          userId: spmtUser.id,\n          accessToken: readCookie(req.headers.cookie, SPMT_SESSION_COOKIE),\n          eventType:"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected 1 indented XP call site, found {count}')
          text = text.replace(old, new, 1)

          old = "        userId: spmtUser.id,\n        eventType:"
          new = "        userId: spmtUser.id,\n        accessToken: readCookie(req.headers.cookie, SPMT_SESSION_COOKIE),\n        eventType:"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected 1 arena XP call site, found {count}')
          text = text.replace(old, new, 1)

          old = "        spmtXpProducer: SPMT_API_KEY ? { status: 'configured' } : { status: 'degraded', reason: 'SPMT_API_KEY not configured' },"
          new = "        spmtXpProducer: String(process.env.SPACEMOUNTAIN_CLIENT_SECRET || '').trim()\n          ? { status: 'configured', auth: 'spmt-oauth-session' }\n          : { status: 'unavailable', reason: 'SPMT OAuth client is not configured' },"
          if old not in text:
              raise SystemExit('health XP producer status not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify no deprecated runtime key remains
        run: |
          if grep -R "SPMT_API_KEY" -n server.ts src --exclude-dir=node_modules; then
            echo "Deprecated SPMT_API_KEY runtime reference remains"
            exit 1
          fi
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-oauth-xp-bearer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use SPMT OAuth session bearer for XP awards"
          git push origin HEAD:fix/oauth-xp-bearer-20260812
